# ==========================================================================
# Li Yu Laboratory Website - Jekyll Configuration
# 清华大学生命科学学院 俞立实验室
# ==========================================================================

# Site Settings
locale                   : "en-US"
title                    : "Li Yu Lab"
title_separator          : "|"
name                     : &name "Li Yu"
description              : &description "Migrasome Biology Laboratory at Tsinghua University"
url                      : https://liyu-lab-tsinghua.github.io
baseurl                  : ""
repository               : "LiYu-Lab-Tsinghua/LiYu-Lab-Tsinghua.github.io"
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Comments (disabled by default)
comments:
  provider               : false

# Atom Feed
atom_feed:
  path                   :

# SEO
google_site_verification :
bing_site_verification   :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
social:
  type                   : Organization
  name                   : "Li Yu Lab"
  links:

# Analytics
analytics:
  provider               : "google-universal"
  google:
    tracking_id          :

# Site Author
author:
  name             : "Li Yu  俞 立"
  avatar           : "profile.png"
  bio              : "Professor, School of Life Sciences, Tsinghua University. Ph.D. from Peking University, postdoctoral training at NIH. Research focuses on migrasomes, discovered by his group in 2014."
  location         : "Tsinghua University, Beijing, China"
  employer         : "Tsinghua University"
  pubmed           :
  googlescholar    :
  email            : "liyulab@tsinghua.edu.cn"
  researchgate     :
  uri              :
  github           :
  orcid            :
  linkedin         :
  twitter          :
  weibo            :

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown Processing
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  news:
    output: true
    permalink: /news/:name/
  protocols:
    output: true
    permalink: /protocols/:name/
  publications:
    output: true
    permalink: /publications/:name/
  talks:
    output: true
    permalink: /talks/:name/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _news
  - scope:
      path: ""
      type: news
    values:
      layout: single
      author_profile: true
      share: true
  # _protocols
  - scope:
      path: ""
      type: protocols
    values:
      layout: single
      author_profile: true
      share: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development